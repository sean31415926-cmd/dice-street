<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>骰子街 線上桌（免帳號版）</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #E6ECE3;
  --bg2: #D8E1D3;
  --panel: #FFFFFF;
  --panel2: #F3F6F1;
  --ink: #1C2A2C;
  --ink2: #5B6B6D;
  --ink3: #8A9798;
  --line: #CBD6CA;
  --blue: #3B7BD6; --green: #3A9A55; --red: #DB4F45; --purple: #7B55B5; --gold: #D1A11C;
  --blue-soft: #E4EEFB; --green-soft: #E3F3E7; --red-soft: #FBE6E4; --purple-soft: #EEE7F8; --gold-soft: #FBF2D4;
  --coin: #F6BD45; --coin-ink: #5C4100;
  --accent: #1E6E8C; --accent-ink: #FFFFFF; --accent-soft: #DCEBF1;
  --shadow: 0 1px 2px rgba(20,40,40,.08), 0 6px 18px rgba(20,40,40,.08);
  --radius: 14px;
  --font-body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', 'Heiti TC', system-ui, sans-serif;
  --font-display: 'Fredoka', 'Noto Sans TC', 'PingFang TC', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15201D; --bg2: #1C2925; --panel: #22312D; --panel2: #1B2824;
    --ink: #E8EFEA; --ink2: #A6B6AE; --ink3: #7C8C85; --line: #3A4B45;
    --blue-soft: #233650; --green-soft: #1F3A2A; --red-soft: #46261F; --purple-soft: #33284A; --gold-soft: #43381A;
    --accent: #5FB0CF; --accent-ink: #0B1A20; --accent-soft: #223B45;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #15201D; --bg2: #1C2925; --panel: #22312D; --panel2: #1B2824;
  --ink: #E8EFEA; --ink2: #A6B6AE; --ink3: #7C8C85; --line: #3A4B45;
  --blue-soft: #233650; --green-soft: #1F3A2A; --red-soft: #46261F; --purple-soft: #33284A; --gold-soft: #43381A;
  --accent: #5FB0CF; --accent-ink: #0B1A20; --accent-soft: #223B45;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  background-image: radial-gradient(circle at 1px 1px, var(--bg2) 1px, transparent 0);
  background-size: 22px 22px;
}
button { font: inherit; color: inherit; cursor: pointer; appearance: none; -webkit-appearance: none; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.2; }
p { margin: 0; }
.num { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; }
.muted { color: var(--ink2); }
.small { font-size: 13px; }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 999px; border: 2px solid transparent;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px;
  transition: transform .08s ease, filter .12s ease;
}
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.big { padding: 14px 22px; font-size: 17px; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.ghost:hover:not(:disabled) { background: var(--panel2); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: var(--red-soft); color: var(--red); }
.btn.gold { background: var(--coin); color: var(--coin-ink); }
.btn.on { box-shadow: inset 0 0 0 2px var(--accent); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.input {
  font: inherit; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--panel); color: var(--ink); width: 100%;
}
.input:focus { outline: none; border-color: var(--accent); }
label.check { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; cursor: pointer; }
label.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
select.input { appearance: auto; }

/* ---- layout ---- */
.app { max-width: 1480px; margin: 0 auto; padding: 12px; }
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding: 8px 4px 12px;
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 26px; display: flex; align-items: baseline; gap: 8px; }
.brand .sub { font-family: var(--font-body); font-size: 13px; color: var(--ink2); font-weight: 500; }
.code { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; }
.code b { font-family: var(--font-display); font-size: 18px; letter-spacing: .12em; }
.top .spacer { flex: 1; }
.board {
  display: grid; gap: 12px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "turn" "market" "cities" "log";
}
@media (min-width: 820px) {
  .board { grid-template-columns: 320px minmax(0, 1fr); grid-template-areas: "turn market" "cities market" "log log"; }
}
@media (min-width: 1180px) {
  .board { grid-template-columns: 330px minmax(0, 1fr) 300px; grid-template-areas: "turn market log" "cities market log"; }
}
.panel { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.panel h2 { font-size: 16px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.panel h2 .tag { font-weight: 500; font-size: 12px; color: var(--ink2); }
#turnPanel { grid-area: turn; align-self: start; position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 16px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; }
@supports (height: 100dvh) { #turnPanel { max-height: calc(100dvh - 16px - env(safe-area-inset-top, 0px)); } }
@media (max-width: 819px) { #turnPanel { max-height: none; overflow: visible; } }
#marketPanel { grid-area: market; }
#citiesPanel { grid-area: cities; }
#logPanel { grid-area: log; align-self: start; }
@media (max-width: 819px) { #turnPanel { position: static; } }

/* ---- players strip ---- */
.players { display: flex; gap: 8px; overflow-x: auto; padding: 2px; width: 100%; scrollbar-width: thin; }
.pchip {
  flex: 0 0 auto; display: grid; grid-template-columns: auto; gap: 2px;
  padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 2px solid var(--line); min-width: 120px;
}
.pchip.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pchip .pname { font-weight: 700; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.pchip .you { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.pchip .host { font-size: 11px; color: var(--ink2); }
.coins { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.coins::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--coin); box-shadow: inset 0 0 0 2px #E39E1C; }
.lmdots { display: flex; gap: 3px; }
.lmdots i { width: 10px; height: 10px; border-radius: 3px; background: var(--line); display: inline-block; }
.lmdots i.on { background: var(--gold); }
.lmdots i.turn { background: var(--accent); width: 4px; }

/* ---- dice ---- */
.dice { display: flex; gap: 12px; align-items: center; justify-content: center; margin: 8px 0 12px; min-height: 68px; }
.die {
  width: 64px; height: 64px; border-radius: 14px; background: #fff; border: 2px solid #D5DCD3;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 9px;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.08), 0 3px 8px rgba(0,0,0,.12);
}
.die .pip { width: 11px; height: 11px; border-radius: 50%; background: #1C2A2C; place-self: center; }
.die.blank { background: var(--panel2); border-style: dashed; }
.die.rolling { animation: wobble .5s ease; }
@keyframes wobble { 0% { transform: rotate(-12deg) scale(.9); } 50% { transform: rotate(10deg) scale(1.05); } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .die.rolling { animation: none; } }
.total { text-align: center; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1; }
.total small { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--ink2); display: block; margin-top: 4px; }
.turnhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.turnhead .who { font-weight: 700; font-size: 17px; }
.turnhead .round { color: var(--ink2); font-size: 13px; }
.hint { background: var(--panel2); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--ink2); }
.ledger { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 4px; font-size: 13.5px; max-height: 38vh; overflow-y: auto; overscroll-behavior: contain; }
.ledger .l { padding-left: 10px; border-left: 3px solid var(--line); }
.ledger .l.red { border-color: var(--red); } .ledger .l.blue { border-color: var(--blue); }
.ledger .l.green { border-color: var(--green); } .ledger .l.purple { border-color: var(--purple); }
.ledger .l.buy, .ledger .l.win { border-color: var(--gold); } .ledger .l.roll { border-color: var(--ink); }
.ledger .l.muted { color: var(--ink3); }

details.prev { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
details.prev summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 13.5px; }
details.prev summary::-webkit-details-marker { display: none; }
details.prev summary .pv { font-weight: 700; color: var(--ink2); }
details.prev summary .pv::before { content: "▸ "; color: var(--ink3); }
details.prev[open] summary .pv::before { content: "▾ "; }
details.prev summary .pd { color: var(--ink); }
details.prev .ledger { margin-top: 6px; border-top: 0; padding-top: 0; opacity: .85; }

/* ---- decisions ---- */
.decide { display: grid; gap: 8px; margin-top: 10px; }
.decide h3 { font-size: 15px; }
.choice {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left;
  padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel);
}
.choice:hover { border-color: var(--accent); }
.choice .cn { font-weight: 700; }
.choice .cs { font-size: 12.5px; color: var(--ink2); }
.choice.on { border-color: var(--accent); background: var(--accent-soft); }

/* ---- cards ---- */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.cgrid.compact { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
.card {
  position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr);
  border-radius: 12px; overflow: hidden; background: var(--panel); border: 2px solid var(--line);
  text-align: left; padding: 0; min-height: 96px; width: 100%;
}
.card .band { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; padding: 8px 0; color: #fff; }
.card.blue .band { background: var(--blue); } .card.green .band { background: var(--green); }
.card.red .band { background: var(--red); } .card.purple .band { background: var(--purple); }
.card .band .n { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.1; text-align: center; }
.card .band .ic { font-size: 15px; filter: saturate(.9); }
.card .body { padding: 8px 9px 8px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.card .name { font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.card .cnt { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--ink2); }
.card .desc { font-size: 12px; color: var(--ink2); line-height: 1.4; }
.card .cost { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12.5px; color: var(--ink2); }
.card .cost .coins { font-size: 14px; }
.card.buyable { border-color: var(--accent); cursor: pointer; box-shadow: 0 0 0 3px var(--accent-soft); }
.card.buyable:hover { transform: translateY(-1px); }
.card.dim { opacity: .55; }
.card .closed { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(120,120,120,.18) 0 8px, transparent 8px 16px); display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px; pointer-events: none; }
.card .closed span { background: var(--ink); color: var(--panel); font-size: 11px; padding: 2px 7px; border-radius: 999px; }
.card .set { font-size: 10.5px; color: var(--ink3); }

/* ---- landmarks ---- */
.lmrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 6px 0 12px; }
.lm {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; text-align: left;
  padding: 8px 10px; border-radius: 12px; border: 2px dashed var(--line); background: var(--panel2); width: 100%;
}
.lm .ln { font-weight: 700; font-size: 14px; }
.lm .ld { grid-column: 1 / -1; font-size: 12px; color: var(--ink2); line-height: 1.4; }
.lm.built { border-style: solid; border-color: var(--gold); background: var(--gold-soft); }
.lm.buyable { border-style: solid; border-color: var(--accent); background: var(--panel); cursor: pointer; box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---- cities ---- */
.city { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel); }
.city summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 700; }
.city summary::-webkit-details-marker { display: none; }
.city summary::before { content: "▸"; color: var(--ink3); transition: transform .15s; }
.city[open] summary::before { transform: rotate(90deg); }
.city .stat { font-weight: 500; color: var(--ink2); font-size: 13px; }
.city .inner { margin-top: 10px; }

/* ---- log ---- */
.log { max-height: 60vh; overflow: auto; display: grid; gap: 4px; font-size: 13.5px; padding-right: 4px; }
@media (min-width: 1180px) { .log { max-height: calc(100vh - 140px); } }
.log .l { padding: 3px 0 3px 10px; border-left: 3px solid var(--line); }
.log .l.red { border-color: var(--red); } .log .l.blue { border-color: var(--blue); }
.log .l.green { border-color: var(--green); } .log .l.purple { border-color: var(--purple); }
.log .l.buy, .log .l.win { border-color: var(--gold); } .log .l.roll { border-color: var(--ink); font-weight: 700; }
.log .l.sys { border-color: var(--accent); } .log .l.muted { color: var(--ink3); }

/* ---- home ---- */
.home { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
.hero { padding: 26px 8px 6px; }
.hero h1 { font-family: var(--font-display); font-size: clamp(38px, 8vw, 64px); font-weight: 700; letter-spacing: .02em; }
.hero p { color: var(--ink2); font-size: 16px; margin-top: 6px; max-width: 42em; }
.hero .dicehero { display: flex; gap: 10px; margin-bottom: 14px; }
.hero .die { width: 48px; height: 48px; padding: 7px; border-radius: 11px; }
.hero .die .pip { width: 8px; height: 8px; }
.grid2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.roomlist { display: grid; gap: 8px; }
.roomrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); text-align: left; width: 100%; }
.roomrow .rc { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .1em; }
.roomrow .rn { font-size: 13px; color: var(--ink2); }
.status { font-size: 13px; color: var(--ink2); padding: 8px 12px; border-radius: 10px; background: var(--panel2); }
.status.warn { background: var(--gold-soft); color: var(--coin-ink); }
.status.bad { background: var(--red-soft); color: var(--red); }

/* ---- lobby ---- */
.lobby { max-width: 820px; margin: 0 auto; display: grid; gap: 14px; }
.seat { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel2); }
.seat .no { font-family: var(--font-display); font-weight: 700; width: 24px; color: var(--ink2); }
.seat .empty { color: var(--ink3); }

/* ---- rules dialog ---- */
dialog { border: 0; border-radius: 16px; padding: 0; max-width: min(900px, 94vw); width: 100%; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; overscroll-behavior: contain; }
dialog::backdrop { background: rgba(10, 20, 20, .5); }
.dlg { padding: 20px; display: grid; gap: 16px; }
.dlg h2 { font-size: 20px; }
.dlg h3 { font-size: 15px; margin-top: 6px; }
.dlg ol, .dlg ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.dlg .close { position: sticky; top: 0; display: flex; justify-content: flex-end; }
.ctable { width: 100%; border-collapse: collapse; font-size: 13px; }
.ctable th, .ctable td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ctable th { color: var(--ink2); font-weight: 500; }
.ctable .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
.ctable .sw.blue { background: var(--blue); } .ctable .sw.green { background: var(--green); } .ctable .sw.red { background: var(--red); } .ctable .sw.purple { background: var(--purple); }
.tablewrap { overflow-x: auto; }

/* ---- toast ---- */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow); z-index: 50; max-width: 92vw; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.winbox { text-align: center; padding: 12px 0; }
.winbox .big { font-family: var(--font-display); font-size: 28px; font-weight: 700; }
</style>
</head>
<body>
<div id="app" class="app"></div>
<dialog id="rulesDlg"><div class="dlg" id="rulesBody"></div></dialog>
<script>
/* ===== 卡片資料：基本版 + 港灣擴充 + 富豪街擴充 ===== */
const ICONS = {
  wheat:{e:'🌾',zh:'穀物'}, cow:{e:'🐄',zh:'牛'}, gear:{e:'⚙️',zh:'齒輪'},
  bread:{e:'🍞',zh:'麵包'}, cup:{e:'☕',zh:'杯子'}, factory:{e:'🏭',zh:'工廠'},
  fruit:{e:'🍎',zh:'水果'}, boat:{e:'⛵',zh:'船'}, flower:{e:'🌸',zh:'花'},
  suitcase:{e:'💼',zh:'手提箱'}, major:{e:'🏢',zh:'大型建築'}
};
const COLOR_ZH = {blue:'藍', green:'綠', red:'紅', purple:'紫'};
const COLOR_WHEN = {blue:'任何人的回合', green:'自己的回合', red:'別人的回合', purple:'自己的回合'};
const SET_ZH = {base:'基本版', harbor:'港灣擴充', mr:'富豪街擴充'};

/* effect.kind:
   blue:  bank(amt,cond?) | tuna
   green: bank(amt) | perIcon(icon,amt) | soda | general | loan | winery | demolition | moving
   red:   take(amt,cond?) | takeAll(cond)
   purple: stadium | tv | business | publisher | tax | park | renovation | tech | exhibit
   cond: 'harbor' (擁有者已建港口) | 'lt2' (擁有者地標<2) | 'lmgte2' / 'lmgte3' (擲骰玩家地標數)
*/
const CARDS = [
  // ---- 基本版 ----
  {id:'wheat',    zh:'麥田',     en:'Wheat Field',        set:'base',   color:'blue',   icon:'wheat',   cost:1, nums:[1],      effect:{kind:'bank',amt:1},            desc:'從銀行拿 1 元。'},

/* ===== 遊戲引擎（純邏輯，不碰 DOM） ===== */
const E = (() => {
  let rng = Math.random;
  const d6 = () => 1 + Math.floor(rng() * 6);
  const LOG_MAX = 120;

  function log(s, text, cls) {
    s.logN = (s.logN || 0) + 1;
    s.log.push({t: text, c: cls || '', n: s.logN});
    if (s.log.length > LOG_MAX) s.log.splice(0, s.log.length - LOG_MAX);
  }
  const P = s => s.players;
  const A = s => s.players[s.turn.pi];
  const name = p => p.name;

  function cardsInPlay(s) {
    return CARDS.filter(c => c.set === 'base' || (c.set === 'harbor' && s.settings.harbor) || (c.set === 'mr' && s.settings.mr));
  }
  function landmarksInPlay(s) {
    return LANDMARKS.filter(l => l.set === 'base' || (l.set === 'harbor' && s.settings.harbor));
  }
  const lmCount = p => Object.values(p.lm).filter(Boolean).length;
  const allBuilt = (s, p) => landmarksInPlay(s).every(l => p.lm[l.key]);
  const openCopies = (p, id) => (p.est[id] || 0) - (p.closed[id] || 0);
  function reopenAll(s, p, id) {
    const n = p.closed[id] || 0;
    if (n > 0) { delete p.closed[id]; log(s, `${name(p)} 的 ${CARD_BY_ID[id].zh}${n > 1 ? ' ×' + n : ''} 整修完成，恢復營業（本次不發動）`, 'sys'); }
    return n;
  }
  const mallBonus = (p, card) => (p.lm.mall && (card.icon === 'cup' || card.icon === 'bread')) ? 1 : 0;
  const countIcon = (p, icon) => Object.entries(p.est).reduce((n, [id, k]) => n + (CARD_BY_ID[id].icon === icon ? k : 0), 0);
  const countCupBread = p => countIcon(p, 'cup') + countIcon(p, 'bread');
  const addEst = (p, id, n = 1) => { p.est[id] = (p.est[id] || 0) + n; };
  function removeEst(p, id, n = 1) {
    p.est[id] = (p.est[id] || 0) - n;
    if (p.est[id] <= 0) delete p.est[id];
    if (p.closed[id] && p.closed[id] > (p.est[id] || 0)) { p.closed[id] = p.est[id] || 0; if (!p.closed[id]) delete p.closed[id]; }
  }
  function pay(from, to, amt) { // to may be null (bank)
    const a = Math.min(from.coins, Math.max(0, amt));
    from.coins -= a; if (to) to.coins += a; return a;
  }
  const opponents = s => P(s).filter((p, i) => i !== s.turn.pi);

  /* ---------- 市場 ---------- */
  function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
  function buildMarket(s) {
    const n = P(s).length;
    const up = {}, deck = [];
    for (const c of cardsInPlay(s)) {
      const copies = c.color === 'purple' ? n : 6;
      if (s.settings.market === 'all') up[c.id] = copies;
      else for (let i = 0; i < copies; i++) deck.push(c.id);
    }
    s.market = {up, deck: shuffle(deck)};
    refill(s);
  }
  function refill(s) {
    if (s.settings.market === 'all') return;
    const m = s.market;
    while (Object.keys(m.up).length < 10 && m.deck.length) {
      const id = m.deck.pop();
      m.up[id] = (m.up[id] || 0) + 1;
    }
  }
  function marketTake(s, id) {
    const m = s.market;
    if (!m.up[id]) return false;
    m.up[id] -= 1; if (m.up[id] === 0) delete m.up[id];
    refill(s); return true;
  }
  function marketReturn(s, id, n = 1) {
    const m = s.market;
    if (s.settings.market === 'all' || m.up[id]) m.up[id] = (m.up[id] || 0) + n;
    else for (let i = 0; i < n; i++) m.deck.splice(Math.floor(rng() * (m.deck.length + 1)), 0, id);
  }

  /* ---------- 房間 / 開局 ---------- */
  function newGame(code, hostUid, settings) {
    return {
      code, hostUid, status: 'lobby', createdAt: Date.now(), updatedAt: Date.now(), seq: 0, round: 0,
      settings: Object.assign({harbor: true, mr: true, market: 'ten'}, settings || {}),
      players: [], market: {up: {}, deck: []}, turn: null, queue: [], pending: null, log: [], winner: null,
    };
  }
  function addPlayer(s, uid, pname) {
    if (s.status !== 'lobby') return false;
    if (P(s).some(p => p.uid === uid)) return false;
    if (P(s).length >= 5) return false;
    s.players.push({uid, name: pname, coins: 0, est: {}, closed: {}, lm: {}, tech: 0});
    return true;
  }
  function removePlayer(s, uid) {
    if (s.status !== 'lobby') return false;
    s.players = s.players.filter(p => p.uid !== uid);
    if (s.hostUid === uid && s.players.length) s.hostUid = s.players[0].uid;
    return true;
  }
  function start(s) {
    if (P(s).length < 2) return false;
    s.status = 'playing'; s.winner = null; s.log = []; s.round = 1;
    for (const p of P(s)) {
      p.coins = 3; p.est = {wheat: 1, bakery: 1}; p.closed = {}; p.tech = 0; p.lm = {};
      for (const l of landmarksInPlay(s)) p.lm[l.key] = false;
    }
    buildMarket(s);
    const first = Math.floor(rng() * P(s).length);
    s.queue = []; s.pending = null;
    newTurn(s, first);
    log(s, `遊戲開始！${P(s).map(name).join('、')} 各有 3 元、一座麥田與一間麵包店。${s.settings.harbor ? '（含市政廳）' : ''}`, 'sys');
    log(s, `由 ${name(P(s)[first])} 先開始。`, 'sys');
    return true;
  }
  function newTurn(s, pi) {
    const prev = s.turn;
    s.turn = {pi, step: 'roll', dice: [], raw: 0, total: 0, rerolled: false, harborUsed: false, doubles: false, built: false, invested: false,
      logFrom: s.logN || 0, prevFrom: prev ? prev.logFrom : 0, prevPi: prev ? prev.pi : null};
  }
  function rematch(s) {
    if (s.status !== 'ended') return false;
    return start(s);
  }

  /* ---------- 擲骰 ---------- */
  function roll(s, nDice) {
    const t = s.turn, a = A(s);
    if (t.step !== 'roll') return false;
    if (nDice === 2 && !a.lm.station) nDice = 1;
    doRoll(s, nDice, false); return true;
  }
  function reroll(s) {
    const t = s.turn, a = A(s);
    if (t.step !== 'rolled' || !a.lm.tower || t.rerolled) return false;
    doRoll(s, t.dice.length, true); return true;
  }
  function doRoll(s, nDice, isReroll) {
    const t = s.turn;
    t.dice = nDice === 2 ? [d6(), d6()] : [d6()];
    t.raw = t.dice.reduce((x, y) => x + y, 0);
    t.doubles = nDice === 2 && t.dice[0] === t.dice[1];
    t.harborUsed = false; t.total = t.raw;
    if (isReroll) t.rerolled = true;
    t.step = 'rolled';
    log(s, `${name(A(s))}${isReroll ? ' 重擲，' : ' '}擲出 ${t.dice.join(' + ')}${nDice === 2 ? ' = ' + t.raw : ''}${t.doubles ? '（雙骰同點！）' : ''}`, 'roll');
  }
  const canHarbor = s => s.turn.step === 'rolled' && A(s).lm.harbor && s.turn.raw >= 10;
  function setHarbor(s, on) {
    if (!canHarbor(s)) return false;
    s.turn.harborUsed = !!on; s.turn.total = s.turn.raw + (on ? 2 : 0); return true;
  }
  function confirmRoll(s) {
    if (s.turn.step !== 'rolled') return false;
    if (s.turn.harborUsed) log(s, `${name(A(s))} 使用港口：總和 ${s.turn.raw} → ${s.turn.total}`, 'roll');
    startIncome(s); return true;
  }

  /* ---------- 收入結算 ---------- */
  function redAmount(card, owner, roller) {
    const e = card.effect;
    if (e.cond === 'harbor' && !owner.lm.harbor) return 0;
    if (e.cond === 'lmgte2' && lmCount(roller) < 2) return 0;
    if (e.cond === 'lmgte3' && lmCount(roller) < 3) return 0;
    if (e.kind === 'takeAll') return Infinity;
    return e.amt + mallBonus(owner, card);
  }
  function startIncome(s) {
    const n = s.turn.total, ai = s.turn.pi, ps = P(s), L = ps.length, a = ps[ai];
    s.turn.step = 'income';
    const cards = cardsInPlay(s);
    // 1) 紅色：逆時針從擲骰者右手邊開始
    for (let i = 1; i < L; i++) {
      const p = ps[(ai - i + L) % L];
      for (const card of cards) {
        if (card.color !== 'red' || !card.nums.includes(n) || !p.est[card.id]) continue;
        const open = openCopies(p, card.id); reopenAll(s, p, card.id);
        if (!open) continue;
        const per = redAmount(card, p, a);
        if (per === 0) { log(s, `${name(p)} 的 ${card.zh} 條件不符，沒有發動`, 'muted'); continue; }
        const want = per === Infinity ? a.coins : per * open;
        const got = pay(a, p, want);
        if (got > 0) log(s, `${name(p)} 的 ${card.zh}${open > 1 ? ' ×' + open : ''} 向 ${name(a)} 收了 ${got} 元${got < want ? '（錢不夠，只付得出這些）' : ''}`, 'red');
        else log(s, `${name(p)} 的 ${card.zh} 發動，但 ${name(a)} 已經沒錢可付`, 'muted');
      }
    }
    // 2) 藍色：所有人
    let tunaRoll = null;
    for (let i = 0; i < L; i++) {
      const p = ps[(ai + i) % L];
      for (const card of cards) {
        if (card.color !== 'blue' || !card.nums.includes(n) || !p.est[card.id]) continue;
        const open = openCopies(p, card.id); reopenAll(s, p, card.id);
        if (!open) continue;
        if (card.effect.kind === 'tuna') {
          if (!p.lm.harbor) { log(s, `${name(p)} 的鮪魚船沒有港口，無法出海`, 'muted'); continue; }
          if (tunaRoll === null) { tunaRoll = d6() + d6(); log(s, `鮪魚船出海：${name(a)} 擲出 ${tunaRoll} 點`, 'roll'); }
          p.coins += tunaRoll * open;
          log(s, `${name(p)} 的鮪魚船${open > 1 ? ' ×' + open : ''} 從銀行拿了 ${tunaRoll * open} 元`, 'blue');
          continue;
        }
        const e = card.effect;
        if (e.cond === 'harbor' && !p.lm.harbor) { log(s, `${name(p)} 的 ${card.zh} 沒有港口，沒有發動`, 'muted'); continue; }
        if (e.cond === 'lt2' && lmCount(p) >= 2) { log(s, `${name(p)} 的 ${card.zh} 因地標已達 2 座，沒有發動`, 'muted'); continue; }
        const gain = e.amt * open;
        p.coins += gain;
        log(s, `${name(p)} 的 ${card.zh}${open > 1 ? ' ×' + open : ''} 從銀行拿了 ${gain} 元`, 'blue');
      }
    }
    // 3) 綠色：只有擲骰者
    const deferred = [];
    for (const card of cards) {
      if (card.color !== 'green' || !card.nums.includes(n) || !a.est[card.id]) continue;
      const open = openCopies(a, card.id); reopenAll(s, a, card.id);
      if (!open) continue;
      if (card.effect.kind === 'demolition' || card.effect.kind === 'moving') { deferred.push({id: card.id, copies: open}); continue; }
      applyGreen(s, a, card, open);
    }
    for (const d of deferred) s.queue.push({k: 'card', id: d.id, copies: d.copies});
    // 4) 紫色
    const purples = cards.filter(c => c.color === 'purple' && c.nums.includes(n) && a.est[c.id]).map(c => c.id);
    if (purples.length) s.queue.push({k: 'purples', ids: purples});
    continueQueue(s);
  }
  function applyGreen(s, p, card, open) {
    const e = card.effect; let gain = 0;
    switch (e.kind) {
      case 'bank': gain = (e.amt + mallBonus(p, card)) * open; break;
      case 'perIcon': gain = (countIcon(p, e.icon) * e.amt + mallBonus(p, card)) * open; break;
      case 'general':
        if (lmCount(p) >= 2) { log(s, `${name(p)} 的雜貨店因地標已達 2 座，沒有發動`, 'muted'); return; }
        gain = (2 + mallBonus(p, card)) * open; break;
      case 'soda': gain = P(s).reduce((t, q) => t + countIcon(q, 'cup'), 0) * open; break;
      case 'loan': { const paid = pay(p, null, 2 * open); log(s, `${name(p)} 的貸款公司${open > 1 ? ' ×' + open : ''}：付給銀行 ${paid} 元`, 'green'); return; }
      case 'winery': {
        const v = p.est.vineyard || 0;
        gain = 6 * v * open;
        p.coins += gain;
        p.closed[card.id] = p.est[card.id];
        log(s, `${name(p)} 的釀酒廠${open > 1 ? ' ×' + open : ''} 從銀行拿了 ${gain} 元（${v} 座葡萄園），然後關閉整修`, 'green');
        return;
      }
      default: return;
    }
    p.coins += gain;
    log(s, `${name(p)} 的 ${card.zh}${open > 1 ? ' ×' + open : ''} 從銀行拿了 ${gain} 元`, 'green');
  }
  /* 擲骰者自己的一張藍/綠卡發動（用於搬家/拆除的逐張處理與展覽館） */
  function activateOwn(s, card, copies) {
    const a = A(s);
    if (card.color === 'blue') {
      const e = card.effect;
      if (e.kind === 'tuna') {
        if (!a.lm.harbor) { log(s, `${name(a)} 的鮪魚船沒有港口，無法出海`, 'muted'); return; }
        const r = d6() + d6(); a.coins += r * copies;
        log(s, `鮪魚船出海：${name(a)} 擲出 ${r} 點，拿了 ${r * copies} 元`, 'blue'); return;
      }
      if (e.cond === 'harbor' && !a.lm.harbor) { log(s, `${name(a)} 的 ${card.zh} 沒有港口，沒有發動`, 'muted'); return; }
      if (e.cond === 'lt2' && lmCount(a) >= 2) { log(s, `${name(a)} 的 ${card.zh} 因地標已達 2 座，沒有發動`, 'muted'); return; }
      a.coins += e.amt * copies;
      log(s, `${name(a)} 的 ${card.zh}${copies > 1 ? ' ×' + copies : ''} 從銀行拿了 ${e.amt * copies} 元`, 'blue'); return;
    }
    if (card.color === 'green') {
      if (card.effect.kind === 'demolition') {
        if (!landmarksInPlay(s).some(l => a.lm[l.key])) { log(s, `${name(a)} 的拆除公司發動，但沒有可拆的地標`, 'muted'); return; }
        s.pending = {k: 'demolition', copies}; return;
      }
      if (card.effect.kind === 'moving') { s.pending = {k: 'moving', copies}; return; }
      applyGreen(s, a, card, copies);
    }
  }

  function continueQueue(s) {
    while (!s.pending && s.queue.length) {
      const it = s.queue.shift();
      if (it.k === 'card') activateOwn(s, CARD_BY_ID[it.id], it.copies);
      else if (it.k === 'purples') {
        if (it.ids.length === 1) activatePurple(s, it.ids[0]);
        else if (it.ids.length > 1) s.pending = {k: 'purpleOrder', ids: it.ids};
      }
    }
    if (!s.pending && !s.queue.length && s.turn.step === 'income') enterBuild(s);
  }
  function enterBuild(s) {
    const a = A(s);
    s.turn.step = 'build';
    if (s.settings.harbor && a.coins === 0) { a.coins = 1; log(s, `${name(a)} 結算後 0 元，市政廳補助 1 元`, 'sys'); }
  }

  /* ---------- 紫色 ---------- */
  function activatePurple(s, id) {
    const a = A(s), opps = opponents(s);
    switch (id) {
      case 'stadium': {
        const parts = opps.map(o => { const g = pay(o, a, 2); return g ? `${name(o)} ${g} 元` : null; }).filter(Boolean);
        log(s, `${name(a)} 的體育館：${parts.length ? '向 ' + parts.join('、') + ' 收錢' : '對手都沒錢'}`, 'purple'); break;
      }
      case 'tv':
        if (opps.some(o => o.coins > 0)) s.pending = {k: 'tv'};
        else log(s, `${name(a)} 的電視台發動，但對手都沒錢`, 'muted');
        break;
      case 'business': {
        const mine = Object.keys(a.est).filter(cid => CARD_BY_ID[cid].color !== 'purple');
        const theirs = opps.some(o => Object.keys(o.est).some(cid => CARD_BY_ID[cid].color !== 'purple'));
        if (mine.length && theirs) s.pending = {k: 'business'};
        else log(s, `${name(a)} 的商業中心發動，但沒有可交換的建築`, 'muted');
        break;
      }
      case 'publisher': {
        const parts = opps.map(o => { const g = pay(o, a, countCupBread(o)); return g ? `${name(o)} ${g} 元` : null; }).filter(Boolean);
        log(s, `${name(a)} 的出版社：${parts.length ? '向 ' + parts.join('、') + ' 收錢' : '沒收到錢'}`, 'purple'); break;
      }
      case 'tax': {
        const parts = opps.map(o => { if (o.coins < 10) return null; const g = pay(o, a, Math.floor(o.coins / 2)); return `${name(o)} ${g} 元`; }).filter(Boolean);
        log(s, `${name(a)} 的稅務局：${parts.length ? '向 ' + parts.join('、') + ' 課稅' : '沒有對手持有 10 元以上'}`, 'purple'); break;
      }
      case 'park': {
        const ps = P(s), total = ps.reduce((t, p) => t + p.coins, 0), per = Math.ceil(total / ps.length);
        ps.forEach(p => { p.coins = per; });
        log(s, `${name(a)} 的公園：所有人的錢（共 ${total} 元）平均分配，每人 ${per} 元${per * ps.length > total ? '（銀行補 ' + (per * ps.length - total) + ' 元）' : ''}`, 'purple'); break;
      }
      case 'renovation': {
        const types = new Set(); P(s).forEach(p => Object.keys(p.est).forEach(cid => { if (CARD_BY_ID[cid].color !== 'purple') types.add(cid); }));
        if (types.size) s.pending = {k: 'renovation'};
        else log(s, `${name(a)} 的裝修公司發動，但沒有可整修的建築`, 'muted');
        break;
      }
      case 'tech': {
        const inv = a.tech || 0;
        if (!inv) { log(s, `${name(a)} 的科技新創還沒有投資，沒有收入`, 'muted'); break; }
        const parts = opps.map(o => { const g = pay(o, a, inv); return g ? `${name(o)} ${g} 元` : null; }).filter(Boolean);
        log(s, `${name(a)} 的科技新創（投資 ${inv} 元）：${parts.length ? '向 ' + parts.join('、') + ' 收錢' : '對手都沒錢'}`, 'purple'); break;
      }
      case 'exhibit': {
        const cands = Object.keys(a.est).filter(cid => ['blue', 'green'].includes(CARD_BY_ID[cid].color));
        if (cands.length) s.pending = {k: 'exhibit'};
        else log(s, `${name(a)} 的展覽館發動，但沒有可改為發動的建築`, 'muted');
        break;
      }
    }
  }

  /* ---------- 玩家決定 ---------- */
  function decide(s, choice) {
    const pd = s.pending; if (!pd) return false;
    const a = A(s), ps = P(s);
    switch (pd.k) {
      case 'purpleOrder': {
        if (!pd.ids.includes(choice.id)) return false;
        const rest = pd.ids.filter(x => x !== choice.id);
        s.pending = null;
        if (rest.length) s.queue.unshift({k: 'purples', ids: rest});
        activatePurple(s, choice.id); break;
      }
      case 'tv': {
        const o = ps[choice.pid]; if (!o || o === a) return false;
        s.pending = null;
        const g = pay(o, a, 5);
        log(s, `${name(a)} 的電視台向 ${name(o)} 收了 ${g} 元`, 'purple'); break;
      }
      case 'business': {
        s.pending = null;
        if (!choice || choice.skip) { log(s, `${name(a)} 的商業中心：選擇不交換`, 'muted'); break; }
        const o = ps[choice.pid];
        if (!o || o === a || !a.est[choice.mine] || !o.est[choice.theirs]) return false;
        if (CARD_BY_ID[choice.mine].color === 'purple' || CARD_BY_ID[choice.theirs].color === 'purple') return false;
        removeEst(a, choice.mine); addEst(o, choice.mine);
        removeEst(o, choice.theirs); addEst(a, choice.theirs);
        log(s, `${name(a)} 的商業中心：用 ${CARD_BY_ID[choice.mine].zh} 和 ${name(o)} 交換了 ${CARD_BY_ID[choice.theirs].zh}`, 'purple'); break;
      }
      case 'renovation': {
        const card = CARD_BY_ID[choice.id];
        if (!card || card.color === 'purple' || !ps.some(p => p.est[choice.id])) return false;
        s.pending = null;
        const parts = [];
        for (const p of ps) {
          if (!p.est[choice.id]) continue;
          p.closed[choice.id] = p.est[choice.id];
          if (p !== a) { const g = pay(p, a, p.est[choice.id]); if (g) parts.push(`${name(p)} ${g} 元`); }
        }
        log(s, `${name(a)} 的裝修公司：所有人的 ${card.zh} 全部關閉整修${parts.length ? '，向 ' + parts.join('、') + ' 收錢' : ''}`, 'purple'); break;
      }
      case 'exhibit': {
        s.pending = null;
        if (!choice || choice.skip) { log(s, `${name(a)} 的展覽館：選擇不發動`, 'muted'); break; }
        const card = CARD_BY_ID[choice.id];
        if (!card || !a.est[choice.id] || !['blue', 'green'].includes(card.color)) return false;
        const open = openCopies(a, choice.id); reopenAll(s, a, choice.id);
        removeEst(a, 'exhibit'); marketReturn(s, 'exhibit');
        log(s, `${name(a)} 的展覽館改為發動 ${card.zh}，展覽館退回供應區`, 'purple');
        if (open) s.queue.unshift({k: 'card', id: choice.id, copies: open});
        break;
      }
      case 'demolition': {
        const l = LM_BY_KEY[choice.key];
        if (!l || !a.lm[choice.key]) return false;
        a.lm[choice.key] = false; a.coins += 8;
        log(s, `${name(a)} 的拆除公司：拆除了 ${l.zh}，從銀行拿了 8 元`, 'green');
        const left = pd.copies - 1;
        s.pending = (left > 0 && landmarksInPlay(s).some(x => a.lm[x.key])) ? {k: 'demolition', copies: left} : null;
        if (left > 0 && !s.pending) log(s, `${name(a)} 已沒有可拆的地標`, 'muted');
        break;
      }
      case 'moving': {
        const o = ps[choice.pid], card = CARD_BY_ID[choice.id];
        if (!o || o === a || !card || card.color === 'purple' || !a.est[choice.id]) return false;
        removeEst(a, choice.id); addEst(o, choice.id); a.coins += 4;
        log(s, `${name(a)} 的搬家公司：把 ${card.zh} 送給了 ${name(o)}，從銀行拿了 4 元`, 'green');
        const left = pd.copies - 1;
        s.pending = left > 0 ? {k: 'moving', copies: left} : null;
        break;
      }
      default: return false;
    }
    continueQueue(s);
    return true;
  }

  /* ---------- 建造 ---------- */
  function canBuyCard(s, id) {
    if (!s.turn || s.turn.step !== 'build' || s.turn.built) return false;
    const a = A(s), card = CARD_BY_ID[id];
    if (!card || !s.market.up[id]) return false;
    if (card.cost > a.coins) return false;
    if (card.color === 'purple' && a.est[id]) return false;
    return true;
  }
  function canBuyLandmark(s, key) {
    if (!s.turn || s.turn.step !== 'build' || s.turn.built) return false;
    const a = A(s), l = LM_BY_KEY[key];
    return !!l && landmarksInPlay(s).includes(l) && !a.lm[key] && l.cost <= a.coins;
  }
  const canInvest = s => s.turn && s.turn.step === 'build' && !s.turn.invested && A(s).est.tech > 0 && A(s).coins >= 1;

  function buyCard(s, id) {
    if (!canBuyCard(s, id)) return false;
    const a = A(s), card = CARD_BY_ID[id];
    a.coins -= card.cost; addEst(a, id); marketTake(s, id); s.turn.built = true; s.turn.builtName = card.zh;
    log(s, `${name(a)} 花 ${card.cost} 元建造了 ${card.zh}`, 'buy');
    if (card.effect.kind === 'loan') { a.coins += 5; log(s, `貸款公司：${name(a)} 從銀行拿了 5 元`, 'green'); }
    afterBuild(s); return true;
  }
  function buyLandmark(s, key) {
    if (!canBuyLandmark(s, key)) return false;
    const a = A(s), l = LM_BY_KEY[key];
    a.coins -= l.cost; a.lm[key] = true; s.turn.built = true; s.turn.builtName = '地標「' + l.zh + '」';
    log(s, `${name(a)} 花 ${l.cost} 元建造了地標「${l.zh}」`, 'buy');
    if (allBuilt(s, a)) { s.status = 'ended'; s.winner = s.turn.pi; log(s, `🎉 ${name(a)} 蓋完所有地標，獲得勝利！`, 'win'); return true; }
    afterBuild(s); return true;
  }
  function afterBuild(s) { if (!canInvest(s)) endTurn(s); }
  function invest(s) {
    if (!canInvest(s)) return false;
    const a = A(s); a.coins -= 1; a.tech += 1; s.turn.invested = true;
    log(s, `${name(a)} 投資 1 元到科技新創（累計 ${a.tech} 元）`, 'buy');
    if (s.turn.built) endTurn(s);
    return true;
  }
  function endTurn(s) {
    if (!s.turn || s.turn.step !== 'build' || s.status !== 'playing') return false;
    const a = A(s), t = s.turn;
    if (!t.built) {
      if (a.lm.airport) { a.coins += 10; log(s, `${name(a)} 這回合沒有建造，機場補助 10 元`, 'sys'); }
      else log(s, `${name(a)} 這回合沒有建造`, 'muted');
    }
    nextTurn(s, t.doubles && a.lm.amuse);
    return true;
  }
  function summarize(s, extra, forced) {
    const t = s.turn, a = A(s);
    s.lastTurn = {pi: t.pi, dice: t.dice.slice(), total: t.total, builtName: t.builtName || null, invested: !!t.invested,
      airport: !t.built && !!a.lm.airport, extra: !!extra, forced: !!forced};
  }
  function nextTurn(s, extra) {
    summarize(s, extra, false);
    const L = P(s).length;
    if (extra) { log(s, `${name(A(s))} 擲出雙骰同點，遊樂園再給一回合！`, 'sys'); newTurn(s, s.turn.pi); }
    else { const ni = (s.turn.pi + 1) % L; if (ni === 0) s.round += 1; newTurn(s, ni); }
  }
  function forceSkip(s) { // 主持人強制結束目前回合
    if (s.status !== 'playing') return false;
    log(s, `主持人強制結束了 ${name(A(s))} 的回合`, 'sys');
    s.queue = []; s.pending = null; summarize(s, false, true);
    const L = P(s).length, ni = (s.turn.pi + 1) % L; if (ni === 0) s.round += 1; newTurn(s, ni);
    return true;
  }

  /* 依身分套用玩家動作（房主／輪到的人才能做對應的事） */
  const TURN_ACTS = {roll: 1, reroll: 1, confirmRoll: 1, decide: 1, buyCard: 1, buyLandmark: 1, invest: 1, endTurn: 1, setHarbor: 1};
  function apply(s, action, args, from) {
    args = args || [];
    const host = s.hostUid === from;
    const active = s.status === 'playing' && s.turn && s.players[s.turn.pi] && s.players[s.turn.pi].uid === from;
    switch (action) {
      case 'start': return host && start(s);
      case 'rematch': return host && rematch(s);
      case 'forceSkip': return host && forceSkip(s);
      case 'setting': {
        if (!host || s.status !== 'lobby') return false;
        const [key, on] = args;
        if (key === 'market') s.settings.market = on ? 'ten' : 'all';
        else if (key === 'harbor' || key === 'mr') s.settings[key] = !!on;
        else if (key === 'botSpeed' && ['fast', 'normal', 'slow'].includes(on)) s.settings.botSpeed = on;
        else if (key === 'botLevel' && ['normal', 'strong'].includes(on)) s.settings.botLevel = on;
        else return false;
        return true;
      }
      case 'addBot': {

    return inc;
  }
  /* 把玩家 pi 的某個變動套到淺複製的狀態上 */
  function probe(s, pi, mod) {
    const p = s.players[pi];
    const np = Object.assign({}, p, {est: Object.assign({}, p.est), lm: Object.assign({}, p.lm), closed: Object.assign({}, p.closed)});
    mod(np);
    const players = s.players.slice(); players[pi] = np;
    return Object.assign({}, s, {players});
  }
  /* 持有現金 K 時，每輪被對手紫卡抽走的期望值 */
  function cashRisk(s, pi, K) {
    const p = s.players[pi]; let r = 0;
    const richest = Math.max(...s.players.map(x => x.coins));
    s.players.forEach((q, qi) => {
      if (qi === pi) return;
      const dq = dist(q), P = nums => nums.reduce((t, n) => t + (dq[n] || 0), 0);
      if (q.est.tax && K >= 10) r += Math.floor(K / 2) * P([8, 9]);
      if (q.est.tv) r += Math.min(5, K) * P([6]) * (K >= richest ? 0.8 : 0.3);
      if (q.est.stadium) r += Math.min(2, K) * P([6]);
      if (q.est.publisher) r += Math.min(K, cupBread(p)) * P([7]);
      if (q.est.tech && q.tech) r += Math.min(K, q.tech) * P([10]);
      if (q.est.park) { const avg = s.players.reduce((t, x) => t + x.coins, 0) / s.players.length; r += Math.max(0, K - avg) * P([11, 12, 13]); }
    });
    return r;
  }
  /* 從現金 K、剩餘地標費用 R、每輪收入 I、剩餘地標數 nU 估算還要幾輪 */
  function roundsToWin(K, R, I, nU, risk) {
    const need = Math.max(0, R - K + (risk || 0));
    if (need <= 0) return nU;
    const g = params.growth, i = Math.max(I, 0.4);
    const t = g > 0 ? Math.log(1 + g * need / i) / Math.log(1 + g) : need / i;
    return Math.max(nU, t);
  }

  /* ---------- 市場模型：現在買得到什麼、牌庫裡的卡平均要等幾輪才會翻出來 ---------- */
  function marketModel(s) {
    const up = Object.assign({}, s.market.up), deck = {};
    for (const id of s.market.deck) deck[id] = (deck[id] || 0) + 1;
    let hidden = 0; for (const id in deck) if (!up[id]) hidden += deck[id];
    const refillRate = params.refillPerPlayer * s.players.length; // 每輪大約翻出幾種新卡
    const delay = {};
    for (const id in deck) if (!up[id] && hidden) { const d = 1 / (refillRate * deck[id] / hidden); if (d <= params.maxDelay) delay[id] = d; }
    return {up, delay};
  }

  /* 長期綜效：買一級產業時，之後可能買到的工廠會放大它；買工廠時，之後補的一級產業也會放大它 */
  function synergyProspect(st, pi, card, mk) {
    const p = st.players[pi]; let v = 0;
    const avail = id => mk.up[id] > 0 ? 1 : (mk.delay[id] ? Math.min(1, 2 / mk.delay[id]) : 0);
    if (card.color === 'blue') {
      for (const f of E.cardsInPlay(st)) {
        if (f.color !== 'green' || f.effect.kind !== 'perIcon' || f.effect.icon !== card.icon || p.est[f.id]) continue;
        v += avail(f.id) * f.effect.amt * pNums(p, f.nums) * 0.5;
      }
      if (card.id === 'vineyard' && !p.est.winery) v += avail('winery') * 6 * pNums(p, [9]) * 0.3;
    } else if (card.color === 'green' && card.effect.kind === 'perIcon') {
      let futurePrim = 0;
      for (const b of E.cardsInPlay(st)) if (b.color === 'blue' && b.icon === card.effect.icon) futurePrim += avail(b.id) * Math.min(2, (mk.up[b.id] || 0) || 1);
      v += Math.min(futurePrim, 2) * card.effect.amt * pNums(p, card.nums) * 0.4;
    }
    return v * params.synergyW;
  }
  const pNums = (p, nums) => nums.reduce((t, n) => t + (dist(p)[n] || 0), 0);

  function bestOpponentT(st, pi) {
    let best = Infinity;
    st.players.forEach((q, qi) => {
      if (qi === pi) return;
      const unb = E.landmarksInPlay(st).filter(l => !q.lm[l.key]);
      const T = roundsToWin(q.coins, unb.reduce((t, l) => t + l.cost, 0), incomePerRound(st, qi), unb.length, 0);
      if (T < best) best = T;
    });
    return best === Infinity ? 0 : best;
  }

  /* ---------- 建造決策：往前規劃 depth 回合（含等待牌庫翻出的卡） ---------- */
  function evaluateOptions(s, pi) {
    const p0 = s.players[pi];
    const unbuilt0 = E.landmarksInPlay(s).filter(l => !p0.lm[l.key]);
    const mk = marketModel(s);
    const T0 = roundsToWin(p0.coins, unbuilt0.reduce((t, l) => t + l.cost, 0), incomePerRound(s, pi), unbuilt0.length, 0);
    const riskOf = (st, K) => cashRisk(st, pi, K) * Math.min(T0, params.riskRounds);

    // 一個規劃節點：st = 套用過變動的狀態、up = 規劃中剩餘的市場、K = 現金
    function expand(st, up, K, depth, first) {
      const p = st.players[pi];
      const unbuilt = E.landmarksInPlay(st).filter(l => !p.lm[l.key]);
      const R = unbuilt.reduce((t, l) => t + l.cost, 0), nU = unbuilt.length;
      const I = incomePerRound(st, pi);
      const opts = [];
      // 不建造（存錢、或領機場補助）
      const passK = K + (p.lm.airport ? 10 : 0);
      opts.push({kind: 'pass', st, up, K: passK, R, nU, I, wait: 0, pen: p.lm.airport ? 0 : params.passPenalty});
      // 地標
      for (const l of unbuilt) {
        if (l.cost > K) continue;
        const st1 = probe(st, pi, np => { np.lm[l.key] = true; np.coins = K - l.cost; });
        let I1 = incomePerRound(st1, pi);
        if (l.key === 'station') I1 += params.stationProspect;
        const Tafter = roundsToWin(K - l.cost, R - l.cost, I1, nU - 1, 0);
        const opp = l.cost * (Math.pow(1 + params.cashReturn, Math.min(Tafter, 40)) - 1);
        opts.push({kind: 'lm', key: l.key, st: st1, up, K: K - l.cost, R: R - l.cost, nU: nU - 1, I: I1, wait: 0, pen: -0.05, extraNeed: opp});
      }
      // 建築：市場上有的立刻買，牌庫裡的要等 delay 輪（這段期間照常有收入）
      const cand = new Set(Object.keys(up).filter(id => up[id] > 0));
      for (const id in mk.delay) cand.add(id);
      for (const id of cand) {
        const c = CARD_BY_ID[id];
        if (c.color === 'purple' && p.est[id]) continue;
        const wait = up[id] > 0 ? 0 : mk.delay[id];
        const Kw = K + wait * I; // 等待期間累積的錢
        if (c.cost > Kw) continue;
        if (first && wait > 0) continue; // 這一步只能買現在就在市場上的卡
        let K1 = Kw - c.cost + (c.effect.kind === 'loan' ? 5 : 0);
        if (id === 'exhibit') { // 展覽館只能用一次：換算成「現在值多少錢」而不是每輪收入
          const d = bestDice(st, pi).n === 2 ? D2 : D1, p10 = d[10] || 0;
          let best = 0; for (const oid of Object.keys(p.est)) { const oc = CARD_BY_ID[oid]; if (oc.color === 'blue' || oc.color === 'green') best = Math.max(best, ownGain(st, p, oc, E.openCopies(p, oid))); }
          const hit = 1 - Math.pow(1 - p10, Math.max(1, Math.min(T0, 20)));
          const waitDiscount = p10 > 0 ? Math.pow(1 + params.growth, -1 / p10) : 0; // 平均要等 1/p 回合才用得到
          K1 += 0.8 * hit * waitDiscount * best;
        }
        const st1 = probe(st, pi, np => { np.est[id] = (np.est[id] || 0) + 1; np.coins = K1; });
        const up1 = Object.assign({}, up); if (wait === 0) up1[id] -= 1;
        let I1 = incomePerRound(st1, pi) + synergyProspect(st, pi, c, mk);
        if (c.effect.cond === 'lt2' || c.effect.kind === 'general') { // 只在地標少於 2 座時有效：效益只算到蓋第 2 座之前
          const cheapest2 = unbuilt.slice().sort((a, b) => a.cost - b.cost).slice(0, Math.max(0, 2 - E.lmCount(p)));
          const H = Math.max(1, (cheapest2.reduce((t, l) => t + l.cost, 0) - K1) / Math.max(I, 0.5) + cheapest2.length);
          I1 = I + (I1 - I) * Math.min(1, H / Math.max(T0, 1));
        }
        opts.push({kind: 'card', id, st: st1, up: up1, K: K1, R, nU, I: I1, wait, pen: 0});
      }
      // 每個選項的葉值：還要幾輪；再扣掉「對手最快還要幾輪」（紅卡、稅務局等會拖慢對手）
      for (const o of opts) {
        o.leaf = o.wait + roundsToWin(o.K, o.R, o.I, o.nU, riskOf(o.st, o.K) + (o.extraNeed || 0)) + o.pen;
        if (params.lambdaOpp > 0) o.leaf -= params.lambdaOpp * bestOpponentT(o.st, pi);
      }
      if (depth <= 1) { for (const o of opts) o.T = o.leaf; }
      else {
        opts.sort((a, b) => a.leaf - b.leaf);
        const keep = opts.slice(0, params.beam);
        for (const o of opts) o.T = o.leaf;
        for (const o of keep) {
          if (o.nU === 0) { o.T = o.leaf; continue; }
          const sub = expand(o.st, o.up, o.K + o.I, depth - 1, false);
          o.T = o.wait + 1 + sub[0].T + o.pen;
        }
      }
      opts.sort((a, b) => a.T - b.T || (a.kind === 'lm' ? -1 : 0) - (b.kind === 'lm' ? -1 : 0));
      return opts;
    }
    return expand(s, mk.up, p0.coins, params.depth, true);
  }
  const buildChoice = (s, pi) => evaluateOptions(s, pi)[0];

  /* 一張卡對我的邊際每輪收益（用於交換／搬家／裝修等相對比較） */
  function cardRate(s, pi, card) {
    const base = incomePerRound(s, pi);
    const ps = probe(s, pi, np => { np.est[card.id] = (np.est[card.id] || 0) + 1; });
    return incomePerRound(ps, pi) - base;
  }
  function ownedRate(s, pi, id) { // 失去一張時少掉的收入
    const base = incomePerRound(s, pi);
    const ps = probe(s, pi, np => { np.est[id] -= 1; if (np.est[id] <= 0) delete np.est[id]; });
    return base - incomePerRound(ps, pi);
  }

  /* ---------- 擲骰相關 ---------- */
  function chooseDice(s, pi) { return bestDice(s, pi).n; }
  function wantReroll(s, pi) { const t = s.turn; return rollValue(s, pi, t.raw, true) < evOwn(s, pi, t.dice.length, true) - params.rerollMargin; }
  function wantHarbor(s, pi) { const t = s.turn; return rollValue(s, pi, t.raw + 2, true) > rollValue(s, pi, t.raw, true) + params.harborMargin; }

  /* ---------- 卡片效果中的選擇 ---------- */
  function decidePending(s, pi) {
    const p = s.players[pi], pd = s.pending, os = s.players.map((q, i) => ({q, i})).filter(x => x.i !== pi);
    const nonPurple = q => Object.keys(q.est).filter(id => CARD_BY_ID[id].color !== 'purple');
    switch (pd.k) {
      case 'purpleOrder': { const pref = ['tv', 'stadium', 'tax', 'publisher', 'tech', 'renovation', 'business', 'exhibit', 'park']; return {id: pref.find(x => pd.ids.includes(x)) || pd.ids[0]}; }
      case 'tv': { const r = os.slice().sort((a, b) => b.q.coins - a.q.coins)[0]; return {pid: r.i}; }
      case 'business': {
        const mineIds = nonPurple(p); if (!mineIds.length) return {skip: true};
        const mine = mineIds.map(id => ({id, v: ownedRate(s, pi, id)})).sort((a, b) => a.v - b.v)[0];
        let best = null;
        os.forEach(x => nonPurple(x.q).forEach(id => { const v = cardRate(s, pi, CARD_BY_ID[id]) + 0.5 * ownedRate(s, x.i, id); if (!best || v > best.v) best = {pid: x.i, id, v}; }));
        if (best && best.v > mine.v + 0.6) return {mine: mine.id, pid: best.pid, theirs: best.id};
        return {skip: true};
      }
      case 'renovation': {
        let bestId = null, bestV = -Infinity;
        const types = new Set(); s.players.forEach(q => Object.keys(q.est).forEach(id => { if (CARD_BY_ID[id].color !== 'purple') types.add(id); }));
        for (const id of types) {
          const gain = os.reduce((t, x) => t + Math.min(x.q.coins, x.q.est[id] || 0) + 0.6 * (x.q.est[id] ? ownedRate(s, x.i, id) : 0), 0);
          const loss = p.est[id] ? 0.6 * ownedRate(s, pi, id) : 0;
          if (gain - loss > bestV) { bestV = gain - loss; bestId = id; }
        }
        return {id: bestId};
      }
      case 'exhibit': {
        let bestId = null, bestV = 0;
        for (const id of Object.keys(p.est)) { const c = CARD_BY_ID[id]; if (!['blue', 'green'].includes(c.color)) continue; const v = ownGain(s, p, c, E.openCopies(p, id)); if (v > bestV) { bestV = v; bestId = id; } }
        return bestId && bestV >= 3 ? {id: bestId} : {skip: true};
      }
      case 'demolition': { // 優先拆「重建最便宜」的地標（通常是港口），除非它正在養漁船而火車站沒在用
        const keys = E.landmarksInPlay(s).filter(l => p.lm[l.key]);
        const base = incomePerRound(s, pi);
        const scored = keys.map(l => {
          const ps = probe(s, pi, np => { np.lm[l.key] = false; });
          const loss = Math.max(0, base - incomePerRound(ps, pi));
          const canRebuildNow = p.coins + 8 >= l.cost;
          return {key: l.key, v: l.cost + loss * (canRebuildNow ? 1 : 4)};
        });
        scored.sort((a, b) => a.v - b.v); return {key: scored[0].key};
      }
      case 'moving': {
        const mineIds = nonPurple(p);
        const mine = mineIds.map(id => ({id, v: ownedRate(s, pi, id)})).sort((a, b) => a.v - b.v)[0];
        const target = os.slice().sort((a, b) => E.lmCount(a.q) - E.lmCount(b.q) || a.q.coins - b.q.coins)[0];
        return {id: mine.id, pid: target.i};
      }
    }
    return null;
  }
  function wantInvest(s, pi) {
    const p = s.players[pi];
    if (!E.canInvest(s)) return false;
    const unbuilt = E.landmarksInPlay(s).filter(l => !p.lm[l.key]);
    return p.coins >= 6 && !unbuilt.some(l => l.cost <= p.coins + 2);
  }

  /* 每次呼叫只做一個引擎動作 */
  function step(s) {
    const t = s.turn, pi = t.pi;
    if (s.status !== 'playing') return false;
    if (t.step === 'roll') return E.roll(s, chooseDice(s, pi));
    if (t.step === 'rolled') {
      const p = s.players[pi];
      if (p.lm.tower && !t.rerolled && wantReroll(s, pi)) return E.reroll(s);
      if (E.canHarbor(s) && !t.harborUsed && wantHarbor(s, pi)) return E.setHarbor(s, true);
      return E.confirmRoll(s);
    }
    if (t.step === 'income') { const c = decidePending(s, pi); return c ? E.decide(s, c) : E.forceSkip(s); }
    if (t.step === 'build') {
      if (t.built) return wantInvest(s, pi) ? E.invest(s) : E.endTurn(s);
      const ch = evaluateOptions(s, pi)[0];
      if (ch.kind === 'lm') return E.buyLandmark(s, ch.key);
      if (ch.kind === 'card') return E.buyCard(s, ch.id);
      return wantInvest(s, pi) ? E.invest(s) : E.endTurn(s);
    }
    return false;
  }
  return {step, chooseDice, buildChoice, evaluateOptions, decidePending, incomePerRound, cardRate, params};
})();

/* ===== 電腦玩家的共用執行器（單機與線上房間都用） ===== */
const BOTS = (() => {
  const NAMES = ['電腦‧小麥', '電腦‧小牛', '電腦‧小森', '電腦‧小礦'];
  const SPEED = {instant: 0, fast: 350, normal: 800, slow: 1400};
  const isBot = p => !!p && typeof p.uid === 'string' && p.uid.startsWith('bot-');
  const speedMs = s => { const k = (s && s.settings && s.settings.botSpeed) || 'normal'; return k in SPEED ? SPEED[k] : SPEED.normal; };
  function nextBot(s) {
    for (let i = 1; i <= 4; i++) { const u = 'bot-' + i; if (!s.players.some(p => p.uid === u)) return {uid: u, name: NAMES[i - 1]}; }
    return null;
  }
  let timer = null, thinking = false;
  const LEVELS = {normal: '普通', strong: '強'};
  const levelOf = s => { const lv = s && s.settings && s.settings.botLevel; return LEVELS[lv] ? lv : 'strong'; };
  /* 兩種強度：普通＝經驗法則版、強＝獲勝輪數規劃版 */
  const stepperFor = s => (levelOf(s) === 'normal' ? AI_V1.step : AI.step);
  /* getS(): 目前狀態；run(fn): 把 fn 套用在狀態上並同步出去；onThink(flag): 顯示「思考中」 */
  function schedule(getS, run, onThink) {
    clearTimeout(timer); timer = null;
    const S = getS(); if (!S || S.status !== 'playing' || !S.turn) return;
    if (!isBot(S.players[S.turn.pi])) return;
    const seq = S.seq, extra = S.turn.step === 'rolled' ? 300 : 0;
    const heavy = false;
    timer = setTimeout(() => {
      timer = null;
      const S2 = getS(); if (!S2 || S2.seq !== seq) { schedule(getS, run, onThink); return; }
      const go = () => {
        thinking = false;
        run(s => {
          if (s.status !== 'playing' || !isBot(s.players[s.turn.pi])) return false;
          const stepFn = stepperFor(s);
          let ok = false; try { ok = stepFn(s); } catch (e) { console.error('AI', e); }
          if (ok === false) E.forceSkip(s);
          return true;
        });
      };
      if (heavy) { thinking = true; if (onThink) onThink(true); setTimeout(go, 40); } else go();
    }, speedMs(S) + extra);
  }
  const cancel = () => { clearTimeout(timer); timer = null; thinking = false; };
  return {NAMES, SPEED, LEVELS, levelOf, isBot, speedMs, nextBot, schedule, cancel, get thinking() { return thinking; }};
})();

/* ===== 單機模式：玩家 vs 電腦（全部在本機執行） ===== */
const LOCALNET = (() => {
  let uid = null;
  function bump() { const S = APP.S; if (!S) return; S.seq = (S.seq || 0) + 1; S.updatedAt = Date.now(); APP.render(); }
  const runBots = () => BOTS.schedule(() => APP.S, fn => { if (fn(APP.S) !== false) bump(); runBots(); }, () => APP.render());
  function start(settings) {
    uid = APP.uid;
    const s = E.newGame('單機', uid, {harbor: settings.harbor, mr: settings.mr, market: settings.market, botSpeed: settings.speed || 'normal', botLevel: settings.level || 'strong'});
    E.addPlayer(s, uid, APP.name() || '你');
    const bots = Math.max(1, Math.min(4, settings.bots | 0));
    for (let i = 0; i < bots; i++) { const b = BOTS.nextBot(s); if (b) E.addPlayer(s, b.uid, b.name); }
    E.start(s);
    APP.setState(s); APP.setView('room'); APP.render();
    runBots();
  }
  function send(name, ...args) {
    const S = APP.S; if (!S) return;
    const ok = E.apply(S, name, args, uid);
    if (ok === false) return;
    bump(); runBots();
  }
  function leave() {
    BOTS.cancel();
    APP.setState(null); APP.setView('home'); APP.render();
  }
  return {
    hasRoomList: false, hostOwnsRoom: true, leaveLabel: '結束單機',
    start, send, leave, rooms: () => [],
    createRoom: () => {}, joinRoom: () => {}, joinFromList: () => {},
    homeStatusHTML: () => '', homeNoteHTML: () => '', homeExtraHTML: () => '',
    connStatusHTML: () => `<span class="code">🤖 單機模式</span>`,
  };
})();

/* ===== 連線層：免帳號版（房主的瀏覽器當主機，玩家用 WebRTC 直連） ===== */
const NET = (() => {

  /* 在 claude.ai 頁面內（有 window.claude）無法連到 WebRTC 的連線伺服器，改成提供檔案下載 */

  const PAGE_SOURCE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  let uid = null, role = null;            // 'host' | 'guest' | null
  let peer = null, hostConn = null;       // guest 端
  const conns = {};                       // host 端：uid -> DataConnection
  let code = '', wantRoom = null, status = 'idle', statusMsg = '';
  let reconnectTimer = null, joinTimer = null;
  const ls = () => APP.ls;
  const toast = m => APP.toast(m);
  const hasPeerLib = () => typeof Peer !== 'undefined';
  function genCode() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let c = ''; for (let i = 0; i < 4; i++) c += a[Math.floor(Math.random() * a.length)]; return c; }
  const setStatus = (st, msg) => { status = st; statusMsg = msg || ''; APP.render(); };
  const saveHost = () => { if (role === 'host' && APP.S) ls().set('mk_host_state', JSON.stringify(APP.S)); };

  function init() {
    uid = ls().get('mk_uid', '') || ('p' + Math.random().toString(36).slice(2, 12)); ls().set('mk_uid', uid);
    APP.setUid(uid); APP.render();
    if (inViewer) return;
    const saved = ls().get('mk_room', '');
    let hostState = null; try { hostState = JSON.parse(ls().get('mk_host_state', '')); } catch (e) {}
    if (saved && !(hostState && hostState.status !== 'ended') && APP.name()) joinRoom(saved, true);
    window.addEventListener('beforeunload', e => { if (role === 'host' && APP.S && APP.S.status === 'playing') { e.preventDefault(); e.returnValue = ''; } });
  }

  /* ---------- 房主 ---------- */
