          <input class="input" id="nameInput" maxlength="12" placeholder="例如：Sean" value="${esc(myName)}">
        </div>
        <div class="grid2">
          <div class="panel">
            <h2>建立房間</h2>
            <label class="check"><input type="checkbox" id="optHarbor" checked><span><b>港灣擴充</b><br><span class="small muted">市政廳、港口、機場、漁船與壽司店等，地標增為 6 座</span></span></label>
            <label class="check"><input type="checkbox" id="optMr" checked><span><b>富豪街擴充</b><br><span class="small muted">整修機制、拆除／搬家／貸款公司、公園、科技新創等</span></span></label>
            <label class="check" style="display:block"><span class="small muted">市場方式</span>
              <select class="input" id="optMarket" style="margin-top:4px">
                <option value="ten">10 疊隨機市場（擴充建議）</option>
                <option value="all">全部攤開（基本版原始規則）</option>
              </select></label>
            <div class="btn-row" style="margin-top:8px"><button class="btn big" data-act="create">建立房間</button></div>
            <div id="homeExtra"></div>
          </div>
          <div class="panel">
            <h2>單機對戰電腦</h2>
            <p class="small muted" style="margin-bottom:8px">用左邊的擴充與市場設定，和 1～4 個電腦玩家對戰。電腦每步只想幾毫秒，停頓是為了讓你看清楚。</p>
            <div class="grid2" style="gap:8px">
              <label class="check" style="display:block"><span class="small muted">電腦人數</span>
                <select class="input" id="optBots" style="margin-top:4px"><option value="1">1 個</option><option value="2">2 個</option><option value="3" selected>3 個</option><option value="4">4 個</option></select></label>
              <label class="check" style="display:block"><span class="small muted">電腦速度</span>
                <select class="input" id="optSpeed" style="margin-top:4px"><option value="fast">快</option><option value="normal" selected>普通</option><option value="slow">慢</option></select></label>
              <label class="check" style="display:block"><span class="small muted">電腦強度</span>
                <select class="input" id="optLevel" style="margin-top:4px"><option value="normal">普通（經驗法則）</option><option value="strong" selected>強（規劃獲勝輪數）</option></select></label>
            </div>
            <div class="btn-row" style="margin-top:8px"><button class="btn big soft" data-act="solo">開始單機對戰</button></div>
          </div>
          <div class="panel">
            <h2>加入房間</h2>
            <input class="input" id="codeInput" maxlength="4" placeholder="輸入 4 碼房號" style="text-transform:uppercase;letter-spacing:.2em;font-family:var(--font-display);font-size:20px">
            <div class="btn-row" style="margin-top:10px"><button class="btn big" data-act="join">加入</button></div>
            ${N().hasRoomList ? '<h2 style="margin-top:18px">進行中的房間</h2><div class="roomlist" id="roomList"></div>' : ''}
          </div>
        </div>
        <div class="panel small muted">${N().homeNoteHTML()}</div>
      </div>`;
      app.querySelector('#nameInput').addEventListener('input', e => { myName = e.target.value; ls.set('mk_name', myName); });
      app.querySelector('#codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') N().joinRoom(e.target.value); });
      try { const h = (location.hash || '').replace('#', '').toUpperCase(); if (/^[A-Z]{4}$/.test(h)) app.querySelector('#codeInput').value = h; } catch (e) {}
    }
    $('#homeStatus').innerHTML = N().homeStatusHTML();
    $('#homeExtra').innerHTML = N().homeExtraHTML ? N().homeExtraHTML() : '';
    renderRoomList();
  }
  function renderRoomList() {
    const el = $('#roomList'); if (!el || !N().hasRoomList) return;
    const rooms = N().rooms();
    if (!rooms.length) { el.innerHTML = `<div class="small muted">目前沒有開放的房間。建一個吧！</div>`; return; }
    el.innerHTML = rooms.map(r => {
      const mine = r.players.some(p => p.uid === uid);
      const label = r.status === 'lobby' ? (mine ? '回到房間' : '加入') : (mine ? '回到牌局' : '觀戰');
      const sets = [r.settings.harbor ? '港灣' : null, r.settings.mr ? '富豪街' : null].filter(Boolean).join('＋') || '基本版';
      return `<button class="roomrow" data-act="joinCode" data-code="${esc(r.code)}">
        <span><span class="rc">${esc(r.code)}</span> <span class="rn">${r.status === 'lobby' ? '等待中' : '進行中'} · ${sets} · ${r.players.length}/5 人</span><br><span class="rn">${esc(r.players.map(p => p.name).join('、'))}</span></span>
        <span class="btn soft" style="padding:6px 12px">${label}</span></button>`;
    }).join('');
  }

  function topHTML() {
    const inPlay = S.status !== 'lobby' ? E.landmarksInPlay(S) : [];
    const conn = N().connStatusHTML ? N().connStatusHTML() : '';
    return `<header class="top">
      <div class="brand">骰子街 <span class="sub">線上桌</span></div>
      <div class="code">房號 <b>${esc(S.code)}</b></div>
      ${conn}
      <div class="spacer"></div>
      <div class="btn-row">
        <button class="btn ghost" data-act="mute" title="開關音效">${SFX.muted ? '🔇 靜音' : '🔊 音效'}</button>
        <button class="btn ghost" data-act="rules">規則與卡表</button>
        ${isHost() && S.status === 'playing' ? `<button class="btn ghost" data-act="forceSkip" title="當輪到的人離線時使用">強制跳過回合</button>` : ''}
        <button class="btn ghost" data-act="leave">${N().leaveLabel || (isHost() && N().hostOwnsRoom ? '關閉房間' : (S.status === 'lobby' && me() ? '離開房間' : '回到大廳'))}</button>
      </div>
      ${S.status !== 'lobby' ? `<div class="players">${S.players.map((p, i) => `
        <div class="pchip ${S.turn && S.turn.pi === i && S.status === 'playing' ? 'active' : ''}">
          <div class="pname">${BOTS.isBot(p) ? '🤖 ' : ''}${esc(p.name)}${BOTS.isBot(p) ? `<span class="host">${BOTS.LEVELS[BOTS.levelOf(S)]}</span>` : ''} ${p.uid === uid ? '<span class="you">你</span>' : ''} ${p.uid === S.hostUid ? '<span class="host">房主</span>' : ''}</div>
          <div class="coins">${p.coins}</div>
          <div class="lmdots">${inPlay.map(l => `<i class="${p.lm[l.key] ? 'on' : ''}" title="${esc(l.zh)}"></i>`).join('')}</div>
        </div>`).join('')}</div>` : ''}
    </header>`;
  }

  function renderLobby() {
    const app = $('#app');
    const seats = []; for (let i = 0; i < 5; i++) seats.push(S.players[i] || null);
    const host = isHost();
    const bs = S.settings.botSpeed || 'normal';
    const hasBots = S.players.some(p => BOTS.isBot(p));
    app.innerHTML = `${topHTML()}
    <div class="lobby">
      <div class="panel">
        <h2>玩家（${S.players.length}/5）</h2>
        ${seats.map((p, i) => `<div class="seat"><span class="no">${i + 1}</span>${p ? `${BOTS.isBot(p) ? '🤖 ' : ''}<b>${esc(p.name)}</b>${p.uid === uid ? ' <span class="you small" style="color:var(--accent)">（你）</span>' : ''}${p.uid === S.hostUid ? ' <span class="small muted">房主</span>' : ''}${host && BOTS.isBot(p) ? `<button class="btn ghost" style="padding:2px 10px;font-size:12px;margin-left:auto" data-act="removeBot" data-uid="${esc(p.uid)}">移除</button>` : ''}` : `<span class="empty">空位 — 把房號 <b>${esc(S.code)}</b> 告訴朋友${host ? '，或加入電腦' : ''}</span>`}</div>`).join('')}
        ${host && S.players.length < 5 ? `<div class="btn-row" style="margin-top:10px"><button class="btn soft" data-act="addBot">🤖 加入電腦玩家</button></div>` : ''}
      </div>
      <div class="panel">
        <h2>設定 <span class="tag">${host ? '房主可以調整' : '由房主設定'}</span></h2>
        <label class="check"><input type="checkbox" data-act="setting" data-key="harbor" ${S.settings.harbor ? 'checked' : ''} ${host ? '' : 'disabled'}><span><b>港灣擴充</b> <span class="small muted">— 市政廳＋港口＋機場，地標 6 座才獲勝</span></span></label>
        <label class="check"><input type="checkbox" data-act="setting" data-key="mr" ${S.settings.mr ? 'checked' : ''} ${host ? '' : 'disabled'}><span><b>富豪街擴充</b> <span class="small muted">— 整修機制與各種公司</span></span></label>
        <label class="check"><input type="checkbox" data-act="setting" data-key="market" ${S.settings.market === 'ten' ? 'checked' : ''} ${host ? '' : 'disabled'}><span><b>10 疊隨機市場</b> <span class="small muted">— 關閉則全部建築攤開供購買</span></span></label>
        ${hasBots ? `<label class="check" style="display:block"><span class="small muted">電腦速度（由房主的裝置執行，房主要留在房間裡）</span>
          <select class="input" data-act="botSpeed" style="margin-top:4px;max-width:240px" ${host ? '' : 'disabled'}><option value="fast" ${bs === 'fast' ? 'selected' : ''}>快</option><option value="normal" ${bs === 'normal' ? 'selected' : ''}>普通</option><option value="slow" ${bs === 'slow' ? 'selected' : ''}>慢</option></select></label>
        <label class="check" style="display:block"><span class="small muted">電腦強度</span>
          <select class="input" data-act="botLevel" style="margin-top:4px;max-width:240px" ${host ? '' : 'disabled'}>${['normal', 'strong'].map(lv => `<option value="${lv}" ${BOTS.levelOf(S) === lv ? 'selected' : ''}>${BOTS.LEVELS[lv]}${lv === 'normal' ? '（經驗法則）' : '（規劃獲勝輪數）'}</option>`).join('')}</select></label>` : ''}
        <div class="btn-row" style="margin-top:12px">
          ${host ? `<button class="btn big" data-act="start" ${S.players.length < 2 ? 'disabled' : ''}>開始遊戲${S.players.length < 2 ? '（至少 2 人）' : ''}</button>` : `<div class="hint">等待房主 ${esc(S.players.find(p => p.uid === S.hostUid)?.name || '')} 開始遊戲…</div>`}
          ${!me() && S.players.length < 5 ? `<button class="btn soft" data-act="joinHere">加入這個房間</button>` : ''}
        </div>
      </div>
    </div>`;
  }

  function renderGame() {
    const app = $('#app');
    if (!app.querySelector('#board')) {
      app.innerHTML = `<div id="top"></div><main class="board" id="board">
        <section class="panel" id="turnPanel"></section>
        <section class="panel" id="marketPanel"></section>
        <section class="panel" id="citiesPanel"></section>
        <aside class="panel" id="logPanel"></aside></main>`;
    }
    if (!S.pending) { ui.biz = null; ui.move = null; }
    const pageY = window.scrollY;
    const setIfChanged = (sel, html) => { const el = $(sel); if (!el || el.innerHTML === html) return false; const st = el.scrollTop; el.innerHTML = html; el.scrollTop = st; return true; };
    setIfChanged('#top', topHTML());
    setIfChanged('#turnPanel', turnHTML());
    setIfChanged('#marketPanel', marketHTML());
    setIfChanged('#citiesPanel', citiesHTML());
    const logEl = $('#logPanel'), oldLog = logEl.querySelector('.log');
    const wasBottom = !oldLog || (oldLog.scrollHeight - oldLog.scrollTop - oldLog.clientHeight < 40);
    const oldTop = oldLog ? oldLog.scrollTop : 0;
    if (setIfChanged('#logPanel', logHTML())) { const l = logEl.querySelector('.log'); if (l) l.scrollTop = wasBottom ? l.scrollHeight : oldTop; }
    if (Math.abs(window.scrollY - pageY) > 2) window.scrollTo(0, pageY);
  }

  function cardHTML(card, opts = {}) {
    const cls = ['card', card.color, opts.buyable ? 'buyable' : '', opts.dim ? 'dim' : ''].join(' ');
    const n = card.nums.length > 1 ? `${card.nums[0]}<br>–<br>${card.nums[card.nums.length - 1]}` : card.nums[0];
    const inner = `<div class="band"><span class="n">${n}</span><span class="ic">${ICONS[card.icon].e}</span></div>
      <div class="body">
        <div class="name"><span>${esc(card.zh)}</span>${opts.count != null ? `<span class="cnt">×${opts.count}</span>` : ''}</div>
        <div class="desc">${esc(card.desc)}</div>
        <div class="cost"><span class="coins">${card.cost}</span><span class="set">${COLOR_ZH[card.color]} · ${COLOR_WHEN[card.color]}${card.set !== 'base' ? ' · ' + SET_ZH[card.set] : ''}</span></div>
      </div>
      ${opts.closed ? `<div class="closed"><span>整修中 ×${opts.closed}</span></div>` : ''}`;
    if (opts.buyable) return `<button class="${cls}" data-act="buyCard" data-id="${card.id}" title="建造 ${esc(card.zh)}">${inner}</button>`;
    return `<div class="${cls}">${inner}</div>`;
  }
  function marketHTML() {
    const up = S.market.up, ids = Object.keys(up).sort((a, b) => CARD_BY_ID[a].nums[0] - CARD_BY_ID[b].nums[0] || CARD_BY_ID[a].cost - CARD_BY_ID[b].cost);
    const canBuy = isMyTurn() && S.turn.step === 'build' && !S.turn.built;
    const deckN = S.market.deck.length;
    return `<h2>市場 <span class="tag">${S.settings.market === 'ten' ? `10 疊隨機市場 · 牌庫剩 ${deckN} 張` : '全部攤開'}${canBuy ? ' · 點卡片建造' : ''}</span></h2>
      <div class="cgrid">${ids.map(id => cardHTML(CARD_BY_ID[id], {count: up[id], buyable: canBuy && E.canBuyCard(S, id), dim: canBuy && !E.canBuyCard(S, id)})).join('')}</div>
      ${ids.length ? '' : '<div class="hint">市場已經空了。</div>'}`;
  }
  function landmarksHTML(p, mine) {
    const canBuy = mine && isMyTurn() && S.turn.step === 'build' && !S.turn.built;
    const chips = E.landmarksInPlay(S).map(l => {
      const buyable = canBuy && E.canBuyLandmark(S, l.key);
      const cls = `lm ${p.lm[l.key] ? 'built' : ''} ${buyable ? 'buyable' : ''}`;
      const inner = `<span class="ln">${p.lm[l.key] ? '✓ ' : ''}${esc(l.zh)}</span><span class="coins">${l.cost}</span><span class="ld">${esc(l.desc)}</span>`;
      return buyable ? `<button class="${cls}" data-act="buyLm" data-key="${l.key}">${inner}</button>` : `<div class="${cls}">${inner}</div>`;
    });
    if (S.settings.harbor) chips.push(`<div class="lm built"><span class="ln">✓ 市政廳</span><span class="small muted">起始</span><span class="ld">${esc(CITY_HALL.desc)}</span></div>`);
    return `<div class="lmrow">${chips.join('')}</div>`;
  }
  function cityHTML(p) {
    const mine = p.uid === uid;
    const ids = Object.keys(p.est).sort((a, b) => CARD_BY_ID[a].nums[0] - CARD_BY_ID[b].nums[0]);
    const open = mine || ui.openCities.has(p.uid);
    return `<details class="city" data-uid="${esc(p.uid)}" ${open ? 'open' : ''}>
      <summary>${esc(p.name)}${mine ? ' <span class="you" style="font-size:11px;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent)">你的城市</span>' : ''}
        <span class="stat"><span class="coins">${p.coins}</span> · 地標 ${E.lmCount(p)}/${E.landmarksInPlay(S).length} · 建築 ${Object.values(p.est).reduce((a, b) => a + b, 0)} 張${p.tech ? ` · 科技新創投資 ${p.tech} 元` : ''}</span></summary>
      <div class="inner">
        ${landmarksHTML(p, mine)}
        <div class="cgrid compact">${ids.map(id => cardHTML(CARD_BY_ID[id], {count: p.est[id], closed: p.closed[id] || 0})).join('')}</div>
      </div></details>`;
  }
  function citiesHTML() {
    const order = [...S.players.keys()].sort((a, b) => (S.players[a].uid === uid ? -1 : 0) - (S.players[b].uid === uid ? -1 : 0));
    return `<h2>城市 <span class="tag">點名字展開</span></h2>${order.map(i => cityHTML(S.players[i])).join('')}`;
  }
  function logHTML() {
    return `<h2>紀錄</h2><div class="log">${S.log.map(l => `<div class="l ${esc(l.c)}">${esc(l.t)}</div>`).join('')}</div>`;
  }

  /* ---------- 回合面板 ---------- */
  function turnHTML() {
    const t = S.turn, a = S.players[t.pi], mine = isMyTurn();
    const diceKey = t.dice.join('-') + '/' + (t.rerolled ? 'r' : '') + S.round + t.pi;
    if (diceKey !== ui.lastDiceKey) { ui.lastDiceKey = diceKey; ui.diceChangedAt = Date.now(); }
    const rolling = t.dice.length && (Date.now() - ui.diceChangedAt) < 600;
    const dice = t.dice.length ? t.dice.map(v => dieHTML(v, rolling ? 'rolling' : '')).join('') : dieHTML(0) + (a.lm.station ? dieHTML(0) : '');
    const total = t.dice.length ? `<div class="total">${t.total}${t.harborUsed ? `<small>港口 +2（原本 ${t.raw}）</small>` : t.doubles ? '<small>雙骰同點</small>' : ''}</div>` : '';
    let body = '';
    if (S.status === 'ended') {
      const w = S.players[S.winner];
      body = `<div class="winbox"><div class="big">🎉 ${esc(w.name)} 獲勝！</div><p class="muted">蓋完了所有地標。</p></div>
        <div class="btn-row" style="justify-content:center">${isHost() ? `<button class="btn big" data-act="rematch">再來一局</button>` : '<div class="hint">等待房主開新的一局…</div>'}</div>`;
      return `<div class="turnhead"><span class="who">遊戲結束</span><span class="round">第 ${S.round} 輪</span></div>${body}${ledgerHTML()}`;
    }
    if (t.step === 'roll') {
      body = mine ? `<div class="btn-row" style="justify-content:center">
          <button class="btn big" data-act="roll" data-n="1">擲 1 顆骰</button>
          <button class="btn big ${a.lm.station ? '' : 'ghost'}" data-act="roll" data-n="2" ${a.lm.station ? '' : 'disabled title="需要先蓋火車站"'}>擲 2 顆骰</button>
        </div>${a.lm.station ? '' : '<p class="small muted" style="text-align:center;margin-top:6px">蓋了火車站才能擲 2 顆。</p>'}`
        : `<div class="hint">等待 ${esc(a.name)} 擲骰…</div>`;
    } else if (t.step === 'rolled') {
      if (mine) {
        const parts = [];
        if (a.lm.tower && !t.rerolled) parts.push(`<button class="btn ghost" data-act="reroll">廣播塔：重骰一次</button>`);
        if (E.canHarbor(S)) parts.push(`<button class="btn ghost ${t.harborUsed ? 'on' : ''}" data-act="harbor">${t.harborUsed ? '✓ 已用港口 +2' : '港口：總和 +2'}</button>`);
        body = `<div class="btn-row" style="justify-content:center">${parts.join('')}<button class="btn big" data-act="confirm">結算收入（${t.total}）</button></div>`;
      } else body = `<div class="hint">${esc(a.name)} 擲出 ${t.total}${a.lm.tower && !t.rerolled ? '，可能會重骰' : ''}…</div>`;
    } else if (t.step === 'income') {
      body = pendingHTML(mine, a);
    } else if (t.step === 'build') {
      if (mine) {
        const btns = [];
        if (E.canInvest(S)) btns.push(`<button class="btn gold" data-act="invest">投資科技新創 1 元</button>`);
        btns.push(`<button class="btn ${t.built ? '' : 'ghost'}" data-act="endTurn">${t.built ? '結束回合' : (a.lm.airport ? '不建造，領機場 10 元' : '不建造，結束回合')}</button>`);
        body = `<div class="hint">你有 <b>${a.coins}</b> 元。${t.built ? '這回合已經建造完成。' : '點「市場」裡亮起的卡片，或「你的城市」裡的地標來建造（只能買一樣）。'}</div>
          <div class="btn-row" style="justify-content:center;margin-top:10px">${btns.join('')}</div>`;
      } else body = `<div class="hint">${BOTS.isBot(a) && BOTS.thinking ? '🤖 ' + esc(a.name) + ' 正在思考要買什麼…' : esc(a.name) + ' 正在建造…'}（${a.coins} 元）</div>`;
    }
    return `<div class="turnhead"><span class="who">${mine ? '輪到你' : '輪到 ' + esc(a.name)}</span><span class="round">第 ${S.round} 輪</span></div>
      <div class="dice">${dice}</div>${total}${body}${ledgerHTML()}`;
  }
  function ledgerHTML() {
    const t = S.turn; if (!t) return '';
    const rows = S.log.filter(l => l.n > t.logFrom);
    return (rows.length ? `<div class="ledger">${rows.map(l => `<div class="l ${esc(l.c)}">${esc(l.t)}</div>`).join('')}</div>` : '') + prevTurnHTML();
  }
  function prevTurnHTML() {
    const t = S.turn, lt = S.lastTurn;
    if (!t || !lt || t.prevPi == null || S.status !== 'playing') return '';
    const rows = S.log.filter(l => l.n > t.prevFrom && l.n <= t.logFrom);
    if (!rows.length) return '';
    const who = S.players[lt.pi] ? (S.players[lt.pi].uid === uid ? '你' : S.players[lt.pi].name) : '?';
    const did = lt.forced ? '被強制跳過' : `擲出 ${lt.total}，${lt.builtName ? '建造了 ' + lt.builtName : (lt.airport ? '沒建造（機場 +10）' : '沒有建造')}${lt.invested ? '，投資科技新創 1 元' : ''}`;
    return `<details class="prev" ${t.step === 'roll' ? 'open' : ''}>
      <summary><span class="pv">上一回合 · ${esc(who)}</span><span class="pd">${esc(did)}</span></summary>
      <div class="ledger">${rows.map(l => `<div class="l ${esc(l.c)}">${esc(l.t)}</div>`).join('')}</div></details>`;
  }

  const PENDING_ZH = {purpleOrder: '決定紫色建築的發動順序', tv: '選擇電視台的收錢對象', business: '決定商業中心要交換哪張建築', renovation: '選擇裝修公司要關閉哪種建築', exhibit: '決定展覽館要改發動哪張建築', demolition: '選擇拆除公司要拆哪座地標', moving: '決定搬家公司要送出哪張建築'};
  function pendingHTML(mine, a) {
    const pd = S.pending;
    if (!pd) return `<div class="hint">結算中…</div>`;
    if (!mine) return `<div class="hint">等待 ${esc(a.name)} ${PENDING_ZH[pd.k] || '做決定'}…</div>`;
    const opps = S.players.map((p, i) => ({p, i})).filter(x => x.i !== S.turn.pi);
    const nonPurple = p => Object.keys(p.est).filter(id => CARD_BY_ID[id].color !== 'purple');
    const choiceBtn = (label, sub, data, on) => `<button class="choice ${on ? 'on' : ''}" data-act="${data.act || 'decide'}" data-json="${attr(data)}"><span class="cn">${label}</span><span class="cs">${sub || ''}</span></button>`;
    switch (pd.k) {
      case 'purpleOrder':
        return `<div class="decide"><h3>骰出 ${S.turn.total}：先發動哪一張？</h3>${pd.ids.map(id => choiceBtn(CARD_BY_ID[id].zh, CARD_BY_ID[id].desc, {id})).join('')}</div>`;
      case 'tv':
        return `<div class="decide"><h3>電視台：向誰收 5 元？</h3>${opps.map(x => choiceBtn(x.p.name, `${x.p.coins} 元`, {pid: x.i})).join('')}</div>`;
      case 'business': {
        const mineIds = nonPurple(a);
        if (!ui.biz) return `<div class="decide"><h3>商業中心：先選你要交出去的建築</h3>${mineIds.map(id => choiceBtn(CARD_BY_ID[id].zh, `你有 ${a.est[id]} 張`, {act: 'bizMine', id})).join('')}${choiceBtn('不交換', '', {skip: true})}</div>`;
        const list = [];
        opps.forEach(x => nonPurple(x.p).forEach(id => list.push(choiceBtn(`${x.p.name} 的 ${CARD_BY_ID[id].zh}`, `${CARD_BY_ID[id].desc}（${x.p.est[id]} 張）`, {mine: ui.biz, pid: x.i, theirs: id}))));
        return `<div class="decide"><h3>用 ${CARD_BY_ID[ui.biz].zh} 換對方的哪一張？</h3>${list.join('')}${choiceBtn('重新選擇', '', {act: 'bizReset'})}${choiceBtn('不交換', '', {skip: true})}</div>`;
      }
      case 'renovation': {
        const types = {}; S.players.forEach(p => Object.keys(p.est).forEach(id => { if (CARD_BY_ID[id].color !== 'purple') (types[id] = types[id] || []).push(`${p.name}${p.est[id] > 1 ? '×' + p.est[id] : ''}`); }));
        const ids = Object.keys(types).sort((x, y) => CARD_BY_ID[x].nums[0] - CARD_BY_ID[y].nums[0]);
        return `<div class="decide"><h3>裝修公司：關閉哪一種建築？</h3><p class="small muted">所有人的該建築都會關閉整修；對手每張付你 1 元。</p>${ids.map(id => choiceBtn(CARD_BY_ID[id].zh, types[id].join('、'), {id})).join('')}</div>`;
      }
      case 'exhibit': {
        const ids = Object.keys(a.est).filter(id => ['blue', 'green'].includes(CARD_BY_ID[id].color)).sort((x, y) => CARD_BY_ID[x].nums[0] - CARD_BY_ID[y].nums[0]);
        return `<div class="decide"><h3>展覽館：改為發動哪一張？</h3><p class="small muted">發動後展覽館會退回供應區。</p>${ids.map(id => choiceBtn(CARD_BY_ID[id].zh, `${CARD_BY_ID[id].desc}（${a.est[id]} 張${a.closed[id] ? '，整修中 ' + a.closed[id] : ''}）`, {id})).join('')}${choiceBtn('不發動，保留展覽館', '', {skip: true})}</div>`;
      }
      case 'demolition': {
        const keys = E.landmarksInPlay(S).filter(l => a.lm[l.key]);
        return `<div class="decide"><h3>拆除公司：必須拆除一座地標（拿 8 元）</h3>${keys.map(l => choiceBtn(l.zh, `重建需要 ${l.cost} 元`, {key: l.key})).join('')}</div>`;
      }
      case 'moving': {
        const mineIds = nonPurple(a);
        if (!ui.move) return `<div class="decide"><h3>搬家公司：必須送出一張建築（拿 4 元）</h3>${mineIds.map(id => choiceBtn(CARD_BY_ID[id].zh, `你有 ${a.est[id]} 張`, {act: 'moveMine', id})).join('')}</div>`;
        return `<div class="decide"><h3>把 ${CARD_BY_ID[ui.move].zh} 送給誰？</h3>${opps.map(x => choiceBtn(x.p.name, `${x.p.coins} 元`, {id: ui.move, pid: x.i})).join('')}${choiceBtn('重新選擇', '', {act: 'moveReset'})}</div>`;
      }
    }
    return '';
  }

  /* ---------- 規則對話框 ---------- */
  function rulesHTML() {
    const sets = S ? S.settings : {harbor: true, mr: true};
    const list = txt => `<ul>${txt.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    const rows = CARDS.map(c => `<tr><td><span class="sw ${c.color}"></span>${esc(c.zh)}<br><span class="small muted">${esc(c.en)}</span></td><td class="num">${c.nums.length > 1 ? c.nums[0] + '–' + c.nums[c.nums.length - 1] : c.nums[0]}</td><td class="num">${c.cost}</td><td>${ICONS[c.icon].e} ${ICONS[c.icon].zh}</td><td>${esc(c.desc)}<br><span class="small muted">${COLOR_WHEN[c.color]}</span></td><td class="small muted">${SET_ZH[c.set]}</td></tr>`).join('');
    const lrows = LANDMARKS.map(l => `<tr><td>${esc(l.zh)}<br><span class="small muted">${esc(l.en)}</span></td><td class="num">—</td><td class="num">${l.cost}</td><td>地標</td><td>${esc(l.desc)}</td><td class="small muted">${SET_ZH[l.set]}</td></tr>`).join('') +
      `<tr><td>市政廳<br><span class="small muted">City Hall</span></td><td class="num">—</td><td class="num">0</td><td>起始卡</td><td>${esc(CITY_HALL.desc)}</td><td class="small muted">港灣擴充</td></tr>`;
    return `<div class="close"><button class="btn ghost" data-act="closeRules">關閉</button></div>
      <h2>骰子街 規則速查</h2>
      <h3>回合流程與基本規則</h3>${list(RULES_TEXT.flow)}
      <h3>購物中心加成</h3><p>${esc(RULES_TEXT.shopping)}</p>
      <h3>港灣擴充${sets.harbor ? '（本局使用）' : ''}</h3>${list(RULES_TEXT.harbor)}
      <h3>富豪街擴充${sets.mr ? '（本局使用）' : ''}</h3>${list(RULES_TEXT.mr)}
      <h3>地標</h3><div class="tablewrap"><table class="ctable"><thead><tr><th>名稱</th><th>號碼</th><th>費用</th><th>類型</th><th>效果</th><th>來源</th></tr></thead><tbody>${lrows}</tbody></table></div>
      <h3>建築卡（依號碼排序）</h3><div class="tablewrap"><table class="ctable"><thead><tr><th>名稱</th><th>號碼</th><th>費用</th><th>圖示</th><th>效果</th><th>來源</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="small muted">卡片中文名稱為本站翻譯，可能與實體中文版略有差異。壽司店採日版費用 2 元。</p>`;
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', e => {
    SFX.unlock();
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act;
    if (a !== 'mute') SFX.play('click');
    const needTurn = () => { if (!isMyTurn()) { toast('還沒輪到你'); return false; } return true; };
    const send = (...args) => N().send(...args);
    switch (a) {
      case 'create': N().createRoom({harbor: $('#optHarbor').checked, mr: $('#optMr').checked, market: $('#optMarket').value}); break;
      case 'solo': {
        if (!$('#nameInput').value.trim()) { toast('先輸入你的暱稱'); break; }
        localMode = true;
        LOCALNET.start({harbor: $('#optHarbor').checked, mr: $('#optMr').checked, market: $('#optMarket').value, bots: +$('#optBots').value, speed: $('#optSpeed').value, level: $('#optLevel').value});
        break;
      }
      case 'join': N().joinRoom($('#codeInput').value); break;
      case 'joinCode': N().joinFromList(el.dataset.code); break;
      case 'joinHere': N().joinRoom(S.code); break;
      case 'resume': N().resume && N().resume(); break;
      case 'leave': { if (localMode) { localMode = false; LOCALNET.leave(); } else N().leave(); break; }
      case 'mute': SFX.toggle(); render(); break;
      case 'rules': $('#rulesBody').innerHTML = rulesHTML(); $('#rulesDlg').showModal(); break;
      case 'closeRules': $('#rulesDlg').close(); break;
      case 'start': if (isHost()) send('start'); break;
      case 'addBot': if (isHost()) send('addBot'); break;
      case 'removeBot': if (isHost()) send('removeBot', el.dataset.uid); break;
      case 'rematch': if (isHost()) send('rematch'); break;
      case 'forceSkip': if (isHost() && confirm(`要強制結束 ${pname(S.turn.pi)} 的回合嗎？`)) send('forceSkip'); break;
      case 'roll': if (needTurn()) send('roll', +el.dataset.n); break;
      case 'reroll': if (needTurn()) send('reroll'); break;
      case 'harbor': if (needTurn()) send('setHarbor', !S.turn.harborUsed); break;
      case 'confirm': if (needTurn()) { ui.biz = null; ui.move = null; send('confirmRoll'); } break;
      case 'decide': if (needTurn()) { const c = JSON.parse(el.dataset.json); ui.biz = null; ui.move = null; send('decide', c); } break;
      case 'bizMine': ui.biz = JSON.parse(el.dataset.json).id; render(); break;
      case 'bizReset': ui.biz = null; render(); break;
      case 'moveMine': ui.move = JSON.parse(el.dataset.json).id; render(); break;
      case 'moveReset': ui.move = null; render(); break;
      case 'buyCard': if (needTurn()) send('buyCard', el.dataset.id); break;
      case 'buyLm': if (needTurn()) send('buyLandmark', el.dataset.key); break;
      case 'invest': if (needTurn()) send('invest'); break;
      case 'endTurn': if (needTurn()) send('endTurn'); break;
    }
  });
  document.addEventListener('change', e => {
    const sp = e.target.closest('[data-act="botSpeed"]');
    if (sp) { if (isHost()) N().send('setting', 'botSpeed', sp.value); return; }
    const th = e.target.closest('[data-act="botLevel"]');
    if (th) { if (isHost()) N().send('setting', 'botLevel', th.value); return; }
    const el = e.target.closest('[data-act="setting"]'); if (!el || !isHost()) return;
    N().send('setting', el.dataset.key, el.checked);
  });
  document.addEventListener('toggle', e => {
    const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.classList.contains('city')) return;
    if (d.open) ui.openCities.add(d.dataset.uid); else ui.openCities.delete(d.dataset.uid);
  }, true);
  $('#rulesDlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

  const api = {
    get S() { return S; }, get uid() { return uid; }, get view() { return view; },
    setState(s) { S = s; }, setUid(u) { uid = u; }, setView(v) { view = v; if (v === 'home') { const app = $('#app'); if (app && !app.querySelector('.home')) app.innerHTML = ''; } },
    render, renderRoomList, toast, name: () => myName.trim(), ls, isHost, me,
  };
  setTimeout(() => NET.init(), 0);
  return api;
})();
</script>
</body>
</html>
